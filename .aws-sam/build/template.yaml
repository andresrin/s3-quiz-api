AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Quiz API - S3 con SAM
Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
Resources:
  ListBucketsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ListBucketsFunction
      Handler: app.lambda_handler
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - s3:ListAllMyBuckets
          Resource: '*'
      Events:
        Api:
          Type: Api
          Properties:
            Path: /buckets
            Method: get
    Metadata:
      SamResourceId: ListBucketsFunction
  ListObjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ListObjectsFunction
      Handler: app.lambda_handler
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - s3:ListBucket
          Resource: '*'
      Events:
        Api:
          Type: Api
          Properties:
            Path: /objects
            Method: get
    Metadata:
      SamResourceId: ListObjectsFunction
Outputs:
  ApiUrl:
    Description: URL de la API
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
